<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
  <title>Website availability</title>
</head>
<body>
  <div class="container">
    <h1>Is it available?</h1>
    <input id="textinput" type="text" class="textfield" placeholder="Links, separated by commas">
    <button onclick="pingWebsite()" class="button">Send</button>
  </div>
  <div id="results">

  </div>
  <script src="main.js"></script>
  <div id="loading" class="loading-overlay">
    <div class="loading-content">
      <div class="spinner"></div>
      <p>Pinging in progress...</p>
    </div>
  </div>
</body>
</html>
